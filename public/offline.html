<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huna — Offline site visits</title><style>body{font:15px Arial;background:#f4f6ef;color:#233d30;padding:30px;max-width:750px;margin:auto}header{font:35px Georgia;margin:20px 0}h1{font-size:23px}p,small{color:#829276;line-height:1.6}article{background:white;border:1px solid #dfe7d5;padding:20px;margin:15px 0;border-radius:8px}button,a{display:inline-block;padding:12px 20px;background:#264432;color:white;border:0;border-radius:5px;text-decoration:none;margin:15px 5px 0 0}h2{font-size:18px}</style><header>huna <i>for huna</i></header><h1>Your offline visit list</h1><p>Property details saved on this device. This is a snapshot; connect to refresh it. No tenant or financial information is saved here.</p><small id="saved"></small><main id="list"></main><a href="/dashboard">Back to workspace</a><button id="clear">Clear saved data</button><script>function render(){let data;try{data=JSON.parse(localStorage.getItem('huna-visit')||'null')}catch{}document.getElementById('list').replaceChildren();document.getElementById('saved').textContent=data?'Saved: '+data.saved:'No property details saved. Enable offline access from your workspace.';for(const p of data?.properties||[]){const a=document.createElement('article'),h=document.createElement('h2'),v=document.createElement('p');h.textContent=p.name;v.textContent=p.area+', Nairobi · '+p.units+' units · '+p.occupied+' occupied';a.append(h,v);document.getElementById('list').append(a)}}document.getElementById('clear').onclick=()=>{localStorage.removeItem('huna-visit');render()};render();</script></html>
